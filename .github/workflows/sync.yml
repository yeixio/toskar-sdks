name: sync

# Each day, and on demand: when Toskar Core has a release newer than the
# spec the SDKs were generated from, sync it and regenerate, onto a branch.
# CI and the conformance cases (against that Core release) run on the
# branch, and when they pass it goes to main with SYNC_DEPLOY_KEY, a write
# deploy key on this repository: main needs an approved pull request,
# except from a deploy key. Nothing is published until a release tag.
# When a check fails, main moved meanwhile, or the key isn't set, it opens
# a pull request instead.
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: A core tag or commit to sync, in place of its latest release
        required: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      ref: ${{ steps.which.outputs.ref }}
      branch: ${{ steps.push.outputs.branch }}
      sha: ${{ steps.push.outputs.sha }}
      base: ${{ steps.push.outputs.base }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Which core to sync
        id: which
        run: |
          ref="${{ inputs.ref }}"
          if [ -z "$ref" ]; then
            ref="$(gh release view --repo yeixio/toskar-core --json tagName --jq .tagName)"
            # Only a release newer than what's synced: the pinned commit may be ahead of it.
            have="$(sed -n 's/^commit: //p' spec/SOURCE)"
            if gh api "repos/yeixio/toskar-core/compare/$ref...$have" --jq .status | grep -qE 'ahead|identical'; then
              echo "spec/SOURCE already has $ref"; exit 0
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - if: steps.which.outputs.ref != ''
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - if: steps.which.outputs.ref != ''
        uses: actions/setup-go@v6
        with:
          go-version: stable
      - if: steps.which.outputs.ref != ''
        run: npm ci && (cd typescript && npm ci) && pip install -e "python[dev]"
      - if: steps.which.outputs.ref != ''
        name: Sync and regenerate
        run: |
          scripts/sync-spec.sh "${{ steps.which.outputs.ref }}"
          (cd typescript && npm run generate)
          (cd python && python scripts/generate.py && python scripts/reference.py)
          (cd go && go generate ./...)
          (cd typescript && npm run reference)
          # Swift's generator runs in the swift image; this runner has no Swift.
          docker run --rm -v "$PWD":/w -w /w swift:6.2 swift/scripts/generate.sh
          python kotlin/scripts/generate.py && python kotlin/scripts/reference.py
          # Swift's error codes page; the rest of its reference changes only with its hand-written code.
          python swift/scripts/reference.py --errors
      - if: steps.which.outputs.ref != ''
        id: push
        name: Push the branch
        run: |
          ref="${{ steps.which.outputs.ref }}"
          git diff --quiet && { echo "Nothing changed"; exit 0; }
          branch="sync/core-$ref"
          base="$(git rev-parse HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A spec typescript/src/generated python/src/toskar/_generated go/api go/codes.go swift/Sources/ToskarAPI swift/Sources/Toskar/Codes.swift kotlin/src/main/kotlin/ai/toskar/api kotlin/src/main/kotlin/ai/toskar/Codes.kt reference
          git commit -m "Sync the SDKs with Toskar Core $ref."
          git push -f origin "$branch"
          { echo "branch=$branch"; echo "sha=$(git rev-parse HEAD)"; echo "base=$base"; } >> "$GITHUB_OUTPUT"

  ci:
    needs: sync
    if: needs.sync.outputs.branch != ''
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}

  conformance:
    needs: sync
    if: needs.sync.outputs.branch != ''
    uses: ./.github/workflows/conformance.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
      core_ref: ${{ needs.sync.outputs.ref }}

  # Both passed: to main, if it hasn't moved since the sync started.
  publish:
    needs: [sync, ci, conformance]
    if: needs.sync.outputs.branch != ''
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_DEPLOY_KEY: ${{ secrets.SYNC_DEPLOY_KEY }}
      REF: ${{ needs.sync.outputs.ref }}
      BRANCH: ${{ needs.sync.outputs.branch }}
      SHA: ${{ needs.sync.outputs.sha }}
      BASE: ${{ needs.sync.outputs.base }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.sync.outputs.sha }}
          # The commit and its parent, main as it was, for the push.
          fetch-depth: 2
      - name: Publish to main
        run: |
          set -euo pipefail
          main="$(git ls-remote origin refs/heads/main | cut -f1)"
          why=""
          if [ -z "$SYNC_DEPLOY_KEY" ]; then
            why="SYNC_DEPLOY_KEY isn't set"
          elif [ "$main" != "$BASE" ]; then
            # What was checked was generated on another main; don't publish it on this one.
            why="main moved while the checks ran"
          else
            key="$RUNNER_TEMP/sync-deploy-key"
            (umask 077 && printf '%s\n' "$SYNC_DEPLOY_KEY" > "$key")
            trap 'rm -f "$key"' EXIT
            export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
            if git push "git@github.com:${GITHUB_REPOSITORY}.git" "$SHA:refs/heads/main"; then
              git push -q origin --delete "$BRANCH" || true
              echo "Published the sync with Toskar Core $REF to main"
              exit 0
            fi
            why="the push to main was refused"
          fi
          echo "::warning::Opening a pull request instead: $why."
          gh pr create --base main --head "$BRANCH" --title "Sync the SDKs with Toskar Core $REF" \
            --body "Regenerated from Toskar Core $REF's API spec and error codes (\`scripts/sync-spec.sh $REF\`). CI and the conformance cases passed; it wasn't published to main because $why." || true

  # A check failed: a pull request, for a person to look at.
  propose:
    needs: [sync, ci, conformance]
    if: failure() && needs.sync.outputs.branch != ''
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      GH_TOKEN: ${{ github.token }}
      REF: ${{ needs.sync.outputs.ref }}
      BRANCH: ${{ needs.sync.outputs.branch }}
    steps:
      - name: Open a pull request
        run: |
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "Sync the SDKs with Toskar Core $REF" \
            --body "Regenerated from Toskar Core $REF's API spec and error codes. **CI or the conformance cases failed** on it ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID), so it wasn't published: the new Core may need a change in the SDKs' hand-written layer." || true

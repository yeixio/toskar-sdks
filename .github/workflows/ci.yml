name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The sync workflow runs CI on what it generated before publishing it.
  workflow_call:
    inputs:
      ref:
        description: The branch or commit to check
        type: string
        default: ""

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: The normalized spec matches spec/openapi.yaml
        run: npm run normalize && git diff --exit-code spec/openapi.sdk.json
      - run: npm ci
        working-directory: typescript
      - name: The generated code matches the spec
        working-directory: typescript
        run: npm run generate && git diff --exit-code src/generated
      - run: npm run typecheck
        working-directory: typescript
      - name: The reference docs match the code
        working-directory: typescript
        run: npm run reference && git diff --exit-code ../reference/typescript
      - run: npm test
        working-directory: typescript
      - run: npm run build
        working-directory: typescript

  python:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
        working-directory: python
      - name: The generated code matches the spec
        # Generated with the newest Python, whose formatters' output is what's committed.
        if: matrix.python == '3.14'
        working-directory: python
        run: python scripts/generate.py && git diff --exit-code src/toskar/_generated
      - name: The reference docs match the code
        if: matrix.python == '3.14'
        working-directory: python
        run: python scripts/reference.py && git diff --exit-code ../reference/python
      - run: python -m mypy src/toskar --ignore-missing-imports
        working-directory: python
      - run: python -m pytest -q
        working-directory: python

  go:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      # The generator needs a newer Go than the module's minimum.
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: The generated code and reference docs match
        run: go generate ./... && git diff --exit-code api codes.go ../reference/go
      # Then vet and test with the oldest Go the module supports.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
      - run: go vet ./...
      - run: go test ./...

  # The conformance image toskar-core's outside-network check runs every SDK from.
  conformance:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - run: docker build -f conformance/Dockerfile -t toskar-conformance .
      - name: Each program answers
        run: |
          for sdk in go python node; do
            out=$(docker run --rm toskar-conformance toskar-conformance-$sdk call /missing.json || true)
            echo "$sdk: $out"
            echo "$out" | grep -q '"code"'
          done

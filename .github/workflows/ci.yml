name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: The normalized spec matches spec/openapi.yaml
        run: npm run normalize && git diff --exit-code spec/openapi.sdk.json
      - run: npm ci
        working-directory: typescript
      - name: The generated code matches the spec
        working-directory: typescript
        run: npm run generate && git diff --exit-code src/generated
      - run: npm run typecheck
        working-directory: typescript
      - run: npm test
        working-directory: typescript
      - run: npm run build
        working-directory: typescript

  python:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
        working-directory: python
      - name: The generated code matches the spec
        # Generated with the newest Python, whose formatters' output is what's committed.
        if: matrix.python == '3.14'
        working-directory: python
        run: python scripts/generate.py && git diff --exit-code src/toskar/_generated
      - run: python -m mypy src/toskar --ignore-missing-imports
        working-directory: python
      - run: python -m pytest -q
        working-directory: python

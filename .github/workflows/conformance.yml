name: conformance

# Every SDK runs the same cases (conformance/run.py) against a throwaway
# Toskar Core built from toskar-core: chat, streaming, events, files,
# errors, and pairing with a pinned certificate. Core chats with a
# scripted model, so no model is downloaded. Then Core's examples run with
# these SDKs, and the READMEs' snippets are checked.
on:
  push:
    branches: [main]
  pull_request:
  # Core changes too: each night against its main.
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:
    inputs:
      core_ref:
        description: The toskar-core branch, tag, or commit to run against
        default: main
  # The sync workflow runs these against the Core it synced, before
  # publishing what it generated.
  workflow_call:
    inputs:
      ref:
        description: The branch or commit of the SDKs to run
        type: string
        default: ""
      core_ref:
        description: The toskar-core branch, tag, or commit to run against
        type: string
        default: main

permissions:
  contents: read

# A new push to a pull request cancels its older run.
concurrency:
  group: conformance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a pull request touches the Swift SDK or what it's built from,
  # so the one home Mac isn't taken for a change that can't affect Swift.
  # Pushes, the nightly run and the sync's call run it always.
  changes:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      swift: ${{ steps.match.outputs.swift }}
    steps:
      - name: Match the changed files
        id: match
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then echo "swift=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[].filename' |
            grep -Eq '^(swift/|Package\.swift$|spec/|conformance/|scripts/|reference/swift/|\.github/workflows/conformance\.yml)'; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  conformance:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/checkout@v7
        with:
          repository: yeixio/toskar-core
          ref: ${{ inputs.core_ref || 'main' }}
          path: core
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-dotnet@v6
        # Not /usr/share/dotnet, which a home runner's user can't write.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: "10.0.x"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Core
        working-directory: core
        env:
          CGO_ENABLED: "0"
        # Not $RUNNER_TEMP/toskar: the Ask Toskar action keeps its Toskar's
        # folder there, and a home runner can still have one.
        run: go build -o "$RUNNER_TEMP/toskar-daemon" ./cmd/daemon
      - name: Build the SDKs
        run: |
          (cd go && go build -o "$RUNNER_TEMP/toskar-conformance-go" ./cmd/toskar-conformance)
          python -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q "./python[anywhere,dev]"
          (cd typescript && npm ci && npm run build)
          (cd kotlin && ./gradlew -q :conformance:installDist)
          dotnet build dotnet/conformance -c Release
          (cd rust/conformance && cargo build --release)
      - name: Run the cases
        run: |
          python conformance/run.py --core "$RUNNER_TEMP/toskar-daemon" \
            --program "go=$RUNNER_TEMP/toskar-conformance-go" \
            --program "python=$RUNNER_TEMP/venv/bin/python python/conformance.py" \
            --program "node=node typescript/conformance.mjs" \
            --program "kotlin=kotlin/conformance/build/install/toskar-conformance/bin/toskar-conformance" \
            --program "dotnet=dotnet dotnet/conformance/bin/Release/net8.0/toskar-conformance.dll" \
            --program "rust=rust/conformance/target/release/toskar-conformance"
      # Toskar Core's examples (examples/), with these SDKs: a change here
      # that breaks one fails before it merges.
      - name: Run Core's examples
        run: |
          python core/examples/test.py --core "$RUNNER_TEMP/toskar-daemon" --sdks . \
            --python "$RUNNER_TEMP/venv/bin/python" --go-sdk-from-checkout
      # The READMEs' snippets: each type-checked against the SDK, and the
      # quick starts run (scripts/check_snippets.py).
      - name: Check the READMEs' snippets
        run: python scripts/check_snippets.py --core "$RUNNER_TEMP/toskar-daemon" --python "$RUNNER_TEMP/venv/bin/python" --langs python,ts,go,kotlin,java,csharp,rust

  # The Swift SDK on a Mac: the conformance cases, and the README's
  # snippets type-checked and the quick start run, against a throwaway Core.
  swift:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ${{ fromJSON(vars.MAC_RUNS_ON || '"macos-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/checkout@v7
        with:
          repository: yeixio/toskar-core
          ref: ${{ inputs.core_ref || 'main' }}
          path: core
      - uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
      - name: Build Core
        working-directory: core
        env:
          CGO_ENABLED: "0"
        run: go build -o "$RUNNER_TEMP/toskar-daemon" ./cmd/daemon
      - name: Run the cases
        run: |
          swift build --product toskar-conformance
          python3 conformance/run.py --core "$RUNNER_TEMP/toskar-daemon" --program "swift=$(swift build --show-bin-path)/toskar-conformance"
      - name: Check the Swift README's snippets
        run: python3 scripts/check_snippets.py --core "$RUNNER_TEMP/toskar-daemon" --langs swift

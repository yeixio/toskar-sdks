name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The sync workflow runs CI on what it generated before publishing it.
  workflow_call:
    inputs:
      ref:
        description: The branch or commit to check
        type: string
        default: ""

permissions:
  contents: read

# A new push to a pull request cancels its older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a pull request touches the Swift SDK or what it's built from,
  # so the one home Mac isn't taken for a change that can't affect Swift.
  # Pushes, the nightly run and the sync's call run it always.
  changes:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      swift: ${{ steps.match.outputs.swift }}
    steps:
      - name: Match the changed files
        id: match
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then echo "swift=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" --jq '.[].filename' |
            grep -Eq '^(swift/|Package\.swift$|spec/|conformance/|scripts/|reference/swift/|\.github/workflows/ci\.yml)'; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  typescript:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: The normalized spec matches spec/openapi.yaml
        run: npm run normalize && git diff --exit-code spec/openapi.sdk.json
      - run: npm ci
        working-directory: typescript
      - name: The generated code matches the spec
        working-directory: typescript
        run: npm run generate && git diff --exit-code src/generated
      - run: npm run typecheck
        working-directory: typescript
      - name: The reference docs match the code
        working-directory: typescript
        run: npm run reference && git diff --exit-code ../reference/typescript
      - run: npm test
        working-directory: typescript
      - run: npm run build
        working-directory: typescript

  python:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
        working-directory: python
      - name: The generated code matches the spec
        # Generated with the newest Python, whose formatters' output is what's committed.
        if: matrix.python == '3.14'
        working-directory: python
        run: python scripts/generate.py && git diff --exit-code src/toskar/_generated
      - name: The reference docs match the code
        if: matrix.python == '3.14'
        working-directory: python
        run: python scripts/reference.py && git diff --exit-code ../reference/python
      - run: python -m mypy src/toskar --ignore-missing-imports
        working-directory: python
      - run: python -m pytest -q
        working-directory: python

  go:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # The generator needs a newer Go than the module's minimum.
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: The generated code and reference docs match
        run: go generate ./... && git diff --exit-code api codes.go ../reference/go
      # Then vet and test with the oldest Go the module supports.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
      - run: go vet ./...
      - run: go test ./...

  # On a Mac: the Swift SDK is for Apple's platforms first.
  swift:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: ${{ fromJSON(vars.MAC_RUNS_ON || '"macos-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: The generated code matches the spec
        run: swift/scripts/generate.sh && git diff --exit-code swift/Sources
      - name: The reference docs match the code
        run: python3 swift/scripts/reference.py && git diff --exit-code reference/swift && test -z "$(git status --porcelain reference/swift)"
      - run: swift build
      - run: swift test

  # Kotlin and Java: generated by a Python script, so the sync needs no JDK.
  kotlin:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: The generated code matches the spec
        run: python3 scripts/generate.py && git diff --exit-code src/main && test -z "$(git status --porcelain src/main)"
      - name: The reference docs match the code
        run: python3 scripts/reference.py && git diff --exit-code ../reference/kotlin && test -z "$(git status --porcelain ../reference/kotlin)"
      - run: ./gradlew build

  # .NET: generated by a Python script, as Kotlin is, so the sync needs no .NET.
  dotnet:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-dotnet@v6
        # Not /usr/share/dotnet, which a home runner's user can't write.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: "10.0.x"
      - name: The generated code matches the spec
        run: python3 scripts/generate.py && git diff --exit-code src && test -z "$(git status --porcelain src)"
      - name: The reference docs match the code
        run: python3 scripts/reference.py && git diff --exit-code ../reference/dotnet && test -z "$(git status --porcelain ../reference/dotnet)"
      - run: dotnet build src/Toskar -c Release
      - run: dotnet test --project tests/Toskar.Tests
      - run: dotnet pack src/Toskar -c Release -o out

  # Rust: generated by a Python script, as Kotlin is, so the sync needs no Rust.
  rust:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: The generated code matches the spec
        run: python3 scripts/generate.py && git diff --exit-code src && test -z "$(git status --porcelain src)"
      - name: The reference docs match the code
        run: python3 scripts/reference.py && git diff --exit-code ../reference/rust && test -z "$(git status --porcelain ../reference/rust)"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo package --allow-dirty --no-verify

  # The conformance image toskar-core's outside-network check runs every SDK from.
  conformance:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - run: docker build -f conformance/Dockerfile -t toskar-conformance .
      - name: Each program answers
        run: |
          for sdk in go python node kotlin; do
            out=$(docker run --rm toskar-conformance toskar-conformance-$sdk call /missing.json || true)
            echo "$sdk: $out"
            echo "$out" | grep -q '"code"'
          done

name: conformance

# Every SDK runs the same cases (conformance/run.py) against a throwaway
# Toskar Core built from toskar-core: chat, streaming, events, files,
# errors, and pairing with a pinned certificate. Core chats with a
# scripted model, so no model is downloaded. Then Core's examples run with
# these SDKs, and the READMEs' snippets are checked.
on:
  push:
    branches: [main]
  pull_request:
  # Core changes too: each night against its main.
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:
    inputs:
      core_ref:
        description: The toskar-core branch, tag, or commit to run against
        default: main
  # The sync workflow runs these against the Core it synced, before
  # publishing what it generated.
  workflow_call:
    inputs:
      ref:
        description: The branch or commit of the SDKs to run
        type: string
        default: ""
      core_ref:
        description: The toskar-core branch, tag, or commit to run against
        type: string
        default: main

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/checkout@v5
        with:
          repository: yeixio/toskar-core
          ref: ${{ inputs.core_ref || 'main' }}
          path: core
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-dotnet@v5
        # Not /usr/share/dotnet, which a home runner's user can't write.
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: "10.0.x"
      - name: Build Core
        working-directory: core
        env:
          CGO_ENABLED: "0"
        # Not $RUNNER_TEMP/toskar: the Ask Toskar action keeps its Toskar's
        # folder there, and a home runner can still have one.
        run: go build -o "$RUNNER_TEMP/toskar-daemon" ./cmd/daemon
      - name: Build the SDKs
        run: |
          (cd go && go build -o "$RUNNER_TEMP/toskar-conformance-go" ./cmd/toskar-conformance)
          python -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q "./python[anywhere,dev]"
          (cd typescript && npm ci && npm run build)
          (cd kotlin && ./gradlew -q :conformance:installDist)
      - name: Run the cases
        run: |
          python conformance/run.py --core "$RUNNER_TEMP/toskar-daemon" \
            --program "go=$RUNNER_TEMP/toskar-conformance-go" \
            --program "python=$RUNNER_TEMP/venv/bin/python python/conformance.py" \
            --program "node=node typescript/conformance.mjs" \
            --program "kotlin=kotlin/conformance/build/install/toskar-conformance/bin/toskar-conformance"
      # Toskar Core's examples (examples/), with these SDKs: a change here
      # that breaks one fails before it merges.
      - name: Run Core's examples
        run: |
          python core/examples/test.py --core "$RUNNER_TEMP/toskar-daemon" --sdks . \
            --python "$RUNNER_TEMP/venv/bin/python" --go-sdk-from-checkout
      # The READMEs' snippets: each type-checked against the SDK, and the
      # quick starts run (scripts/check_snippets.py).
      - name: Check the READMEs' snippets
        run: python scripts/check_snippets.py --core "$RUNNER_TEMP/toskar-daemon" --python "$RUNNER_TEMP/venv/bin/python" --langs python,ts,go,kotlin,java,csharp

  # The Swift SDK on a Mac: the conformance cases, and the README's
  # snippets type-checked and the quick start run, against a throwaway Core.
  swift:
    runs-on: ${{ fromJSON(vars.MAC_RUNS_ON || '"macos-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/checkout@v5
        with:
          repository: yeixio/toskar-core
          ref: ${{ inputs.core_ref || 'main' }}
          path: core
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
      - name: Build Core
        working-directory: core
        env:
          CGO_ENABLED: "0"
        run: go build -o "$RUNNER_TEMP/toskar-daemon" ./cmd/daemon
      - name: Run the cases
        run: |
          swift build --product toskar-conformance
          python3 conformance/run.py --core "$RUNNER_TEMP/toskar-daemon" --program "swift=$(swift build --show-bin-path)/toskar-conformance"
      - name: Check the Swift README's snippets
        run: python3 scripts/check_snippets.py --core "$RUNNER_TEMP/toskar-daemon" --langs swift

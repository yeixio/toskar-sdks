name: release

# A tag vX.Y.Z on main publishes every SDK at that version (RELEASING.md):
# Python to PyPI, TypeScript to npm, .NET to NuGet, and Rust to crates.io,
# all by trusted publishing (no stored token once set up); Kotlin and Java to
# Maven Central, signed; and Go by tagging go/vX.Y.Z, as a module in a
# subfolder needs. Swift needs nothing: SwiftPM reads the tag. Then a GitHub
# release.
#
# Run it by hand to rehearse: it builds the packages and checks them, and
# publishes nothing.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The version, and that every package has it
        id: version
        run: |
          npm_version=$(node -p "require('./typescript/package.json').version")
          py_version=$(sed -n -E 's/^version = "(.*)"/\1/p' python/pyproject.toml)
          kt_version=$(sed -n -E 's/^version = "(.*)"/\1/p' kotlin/build.gradle.kts)
          cs_version=$(sed -n -E 's|.*<Version>(.*)</Version>.*|\1|p' dotnet/src/Toskar/Toskar.csproj)
          rs_version=$(sed -n -E '1,/^version = /s/^version = "(.*)"/\1/p' rust/Cargo.toml)
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME isn't on main"; exit 1; }
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            version="$npm_version"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          [ "$npm_version" = "$version" ] && [ "$py_version" = "$version" ] && [ "$kt_version" = "$version" ] &&
            [ "$cs_version" = "$version" ] && [ "$rs_version" = "$version" ] || {
            echo "::error::the tag says $version; typescript/package.json says $npm_version, python/pyproject.toml $py_version, kotlin/build.gradle.kts $kt_version, dotnet/src/Toskar/Toskar.csproj $cs_version, and rust/Cargo.toml $rs_version (scripts/set-version.sh $version)"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  python:
    needs: check
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI's trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build
        run: |
          cp LICENSE python/
          python -m pip install -q build==1.6.1 twine==7.0.0
          python -m build python
          python -m twine check --strict python/dist/*
      - if: needs.check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: python/dist

  typescript:
    needs: check
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write  # npm's trusted publishing, and provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5 or later.
      - run: npm install -g npm@11.21.0
      - name: Build
        working-directory: typescript
        run: |
          cp ../LICENSE .
          npm ci
          npm run build
          npm publish --dry-run --access public
      - if: needs.check.outputs.publish == 'true'
        working-directory: typescript
        env:
          # Only for the first publish, before the package has a trusted
          # publisher on npmjs.com; empty after, and npm uses this workflow's
          # identity instead (RELEASING.md).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

  kotlin:
    needs: check
    runs-on: ubuntu-latest
    environment: maven-central
    defaults:
      run:
        working-directory: kotlin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: ./gradlew build publishToMavenLocal
      # Signed, uploaded, and released on Maven Central (RELEASING.md).
      - if: needs.check.outputs.publish == 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache

  dotnet:
    needs: check
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write  # NuGet's trusted publishing
    defaults:
      run:
        working-directory: dotnet
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet pack src/Toskar -c Release -o out
      # A key that lasts an hour, for this workflow, from the trusted
      # publishing policy on nuget.org (RELEASING.md).
      - if: needs.check.outputs.publish == 'true'
        id: login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      # The symbols package goes with it.
      - if: needs.check.outputs.publish == 'true'
        run: dotnet nuget push "out/Toskar.${{ needs.check.outputs.version }}.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

  rust:
    needs: check
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write  # crates.io's trusted publishing
    defaults:
      run:
        working-directory: rust
    env:
      # Only for the first publish, before the crate has a trusted publisher
      # on crates.io; empty after (RELEASING.md).
      FIRST_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo publish --dry-run --locked
      - if: needs.check.outputs.publish == 'true' && env.FIRST_TOKEN == ''
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.5
      - if: needs.check.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.FIRST_TOKEN }}
        run: cargo publish --locked

  go:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the go/vX.Y.Z tag
    steps:
      - uses: actions/checkout@v5
      - name: Tag the Go module
        run: |
          tag="go/v${{ needs.check.outputs.version }}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
          # Ask the Go proxy for it, so pkg.go.dev lists it soon.
          curl -fsS "https://proxy.golang.org/github.com/yeixio/toskar-sdks/go/@v/v${{ needs.check.outputs.version }}.info" || true

  release:
    needs: [check, python, typescript, kotlin, dotnet, rust, go]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          contract=$(sed -n -E 's/^export const CONTRACT_VERSION = .([0-9.]+).*/\1/p' typescript/src/generated/contract.ts)
          core=$(sed -n -E 's/^ref: (.*)/\1/p' spec/SOURCE)
          [[ "$core" =~ ^[0-9a-f]{40}$ ]] && core="commit ${core:0:7}"
          printf 'Built for the client contract %s, from Toskar Core %s. They work with any Toskar Core of contract major version %s; an older Core may lack newer routes and fields.\n\n' \
            "$contract" "$core" "${contract%%.*}" > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --notes-file notes.md \
            --title "Toskar SDKs ${{ needs.check.outputs.version }}"

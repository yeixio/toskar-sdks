[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "toskar"
version = "0.1.0"
description = "The official Python SDK for Toskar: local AI across your own computers."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.6,<3"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://toskar.ai/developers"
Repository = "https://github.com/yeixio/toskar-sdks"

[project.optional-dependencies]
# Reaching a paired computer from anywhere: opening its address record.
anywhere = ["cryptography>=42"]
dev = [
  "cryptography==50.0.2",
  "datamodel-code-generator==0.86.0",
  "black==26.10.1",
  "isort==8.0.1",
  "pytest==9.1.1",
  "respx==0.23.1",
  "pytest-asyncio==1.4.0",
  "mypy==2.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toskar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

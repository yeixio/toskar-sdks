[package]
name = "toskar"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "The official Rust SDK for Toskar: local AI across your own computers."
license = "Apache-2.0"
repository = "https://github.com/yeixio/toskar-sdks"
homepage = "https://toskar.ai/developers"
documentation = "https://docs.rs/toskar"
readme = "README.md"
keywords = ["toskar", "ai", "llm", "local-ai", "sdk"]
categories = ["api-bindings", "web-programming::http-client"]
exclude = [".snippetcheck/", "scripts/"]

[dependencies]
# Records' HKDF, AES-GCM, and SHA-256, from the crypto reqwest's rustls uses.
aws-lc-rs = "1.19"
base64 = "0.22.1"
bytes = "1.12"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
# Discovery: the network's interfaces, and a socket that shares mDNS's port.
if-addrs = "0.15.0"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
# Pinning: reqwest's own rustls, with a verifier that checks the pin.
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["net", "sync", "time"] }
# Records' signatures: ECDSA, RSA, and Ed25519.
webpki = { package = "rustls-webpki", version = "0.103.16", default-features = false, features = ["aws-lc-rs", "std"] }

[dev-dependencies]
rcgen = { version = "0.14.7", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
wiremock = "0.6.5"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "toskar"
version = "0.4.0"
description = "The official Python SDK for Toskar: local AI across your own computers."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.6,<3"]
keywords = ["toskar", "ai", "llm", "local-ai", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://toskar.ai/developers"
Repository = "https://github.com/yeixio/toskar-sdks"
Documentation = "https://github.com/yeixio/toskar-sdks/blob/main/reference/python/README.md"
Issues = "https://github.com/yeixio/toskar-sdks/issues"

[project.optional-dependencies]
# Reaching a paired computer from anywhere: opening its address record.
anywhere = ["cryptography>=42"]
# Finding computers on the network (mDNS). zeroconf is LGPL-2.1, imported at run time only.
discovery = ["zeroconf>=0.130"]
dev = [
  "cryptography==50.0.2",
  "zeroconf==0.151.5",
  "datamodel-code-generator==0.86.0",
  "black==26.10.1",
  "isort==8.0.1",
  "pytest==9.1.1",
  "respx==0.23.1",
  "pytest-asyncio==1.4.0",
  "mypy==2.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toskar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
